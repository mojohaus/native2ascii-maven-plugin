name: GitHub CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: Verify
    uses: mojohaus/.github/.github/workflows/maven-verify.yml@master
    with:
      # no run-its profile here; Maven 4 fails on a requested profile that does not exist
      ff-goal: 'verify'
      verify-goal: 'verify'

